plugins { id 'net.fabricmc.fabric-loom' version '1.17.14' }
version = '1.0.0+26.1.2'
group = 'local.icepractice'
base { archivesName = 'ice-practice' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:26.1.2'
 implementation 'net.fabricmc:fabric-loader:0.19.3'
 implementation 'net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release.set(25) }
jar { from('LICENSE', 'COPYING.GPL-3.0', 'THIRD_PARTY_NOTICES.md') }
tasks.register('testIceModel', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'local.icepractice.IceBlastModelTest'
}

tasks.register("testIceUnion", JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = "local.icepractice.IceUnionStoreTest" }

tasks.register("testIceAngleMath", JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = "local.icepractice.IceAngleMathTest" }
tasks.register("testIceAngleCache", JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = "local.icepractice.IceAngleCacheTest" }
tasks.register("testIceWaypoints", JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = "local.icepractice.IceWaypointsTest" }
tasks.register("testIceLocation", JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = "local.icepractice.IceLocationRulesTest" }
tasks.register("testIceWorldIdentity", JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = "local.icepractice.IceWorldIdentityTest" }
tasks.register("testMiningProfit", JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = "local.icepractice.MiningProfitTest" }
